<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Valentine Jessica :)</title>
    <link rel="stylesheet" href="style/style.css" />
    <style>
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .girl-dp {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid #ff4d6d;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>

<body>
    <audio src="img/dd.mp3" id="valentineMusic" loop></audio>

    <div id="click-me-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffcad4; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; cursor: pointer; transition: 0.5s;">
        <div style="font-size: 80px; animation: heartbeat 1.2s infinite;">❤️</div>
        <h2 style="color: #ff4d6d; font-family: 'Arial', sans-serif; margin-top: 20px; text-align: center;">Open your Valentine's surprise...</h2>
        <p style="color: #ff4d6d; font-family: 'Arial', sans-serif;">(Tap the heart)</p>
    </div>

    <div class="container">
        <div class="six">
            <img src="img/IMG_20251219_211731_339.jpg" alt="" class="girl-dp" id="imagePath" />
            <div class="wish">
                <h3 class="wish-hbd">Happy Valentine's Day Gorgeous</h3>
                <h5 id="wishText">I love you Jessica!</h5>
            </div>
        </div>
        </div>

    <script>
        document.getElementById('click-me-overlay').addEventListener('click', function() {
            var audio = document.getElementById('valentineMusic');
            audio.play(); // Music starts
            
            this.style.opacity = '0'; // Screen fades
            setTimeout(() => {
                this.style.display = 'none';
            }, 500);
        });
    </script>

    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
    <script type="text/babel" src="script/main.js"></script>
</body>
</html>
